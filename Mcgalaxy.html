<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Galaxy</title>
</head>
<style>
  body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  overflow: hidden;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background: transparent url('https://raw.githubusercontent.com/JulianLaval/canvas-stars/master/stars.png') repeat top center;
  z-index: 0;
  animation: moveStars 200s linear infinite;
}

@keyframes moveStars {
  from {background-position: 0 0;}
  to {background-position: 10000px 10000px;}
}

.container {
  position: relative;
  z-index: 1;
}

.profile-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  backdrop-filter: blur(10px);
  width: 300px;
}

.profile-img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid #fff;
  margin-bottom: 15px;
}

.bio {
  margin: 10px 0 20px;
  color: #ddd;
}

.social-links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.social {
  padding: 10px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

.tiktok {
  background-color: #010101;
}

.tiktok:hover {
  background-color: #222;
}

.youtube {
  background-color: #FF0000;
}

.youtube:hover {
  background-color: #cc0000;
}
</style>
<body>
  <div class="stars"></div>
  <div class="container">
    <div class="profile-card">
      <img src="https://files.catbox.moe/xtpzuh.jpg" alt="Foto Profil" class="profile-img">
      <h2>MC GALAXY</h2>
      <p class="bio">ini adalah profile MC GALAXY</p>
      <div class="social-links">
        <a href="https://www.tiktok.com/@mc_galaxy.official" target="_blank" class="social tiktok">TikTok</a>
        <a href="https://www.youtube.com/@-" target="_blank" class="social youtube">YouTube</a>
      </div>
    </div>
  </div>
</body>
</html>
